services:
  any-proxy:
    build: .
    image: any-proxy:latest
    ports:
      - "8080:8080"
    environment:
      - LISTEN_ADDR=0.0.0.0:8080
      - RUST_LOG=info
      - MAX_CONCURRENT_REQUESTS=256
      - DENY_CIDRS=
    healthcheck:
      test: ["CMD", "any-proxy", "health-check"]
      interval: 30s
      timeout: 5s
      start_period: 3s
      retries: 3
    restart: unless-stopped
    # 容器加固（N11）：无额度开放代理，资源与权限上限是唯一兜底
    read_only: true # 只写 stdout/stderr，不依赖可写文件系统
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    mem_limit: 256m
    pids_limit: 256
