name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 缓存 Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo clippy
        # --all-targets 让 clippy 覆盖 tests/，否则测试代码的 lint 不会被拦截
        # --locked 确保 Cargo.lock 不在 CI 静默漂移
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --locked

  msrv:
    name: MSRV (1.86)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 MSRV 工具链
        # 与 Cargo.toml 的 rust-version 保持一致，防止无意引入更高版本特性
        uses: dtolnay/rust-toolchain@1.86

      - name: cargo check --locked
        run: cargo check --locked

  audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 依赖安全审计
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # 构建镜像并真正跑起来。此前 CI 完全不碰 Dockerfile，导致 MSRV 从 1.75
  # 修正到 1.86 时漏改构建镜像版本，`docker build` 静默坏掉无人发现。
  docker:
    name: 镜像构建与容器冒烟
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 构建镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: any-proxy:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 启动 gate 应拒绝「无防护 + 非 loopback 监听」
        run: |
          if docker run --rm -e LISTEN_ADDR=0.0.0.0:8080 any-proxy:ci; then
            echo "::error::启动 gate 失效：无防护的 0.0.0.0 监听竟然启动成功"
            exit 1
          fi
          echo "启动 gate 按预期拒绝启动"

      - name: 配置安全带后应正常服务
        run: |
          docker run -d --name smoke -p 8080:8080 \
            -e LISTEN_ADDR=0.0.0.0:8080 -e ALLOW_TARGETS=api.github.com \
            any-proxy:ci
          for _ in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8080/healthz -o /tmp/healthz.json && break
            sleep 1
          done
          cat /tmp/healthz.json
          grep -q '"status":"ok"' /tmp/healthz.json
          # 回显版本须与 Cargo.toml 一致，否则镜像版本无法追溯
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          grep -q "\"version\":\"$crate\"" /tmp/healthz.json
          # 容器内置的 health-check 子命令（compose healthcheck 依赖它）
          docker exec smoke any-proxy health-check
          docker rm -f smoke
